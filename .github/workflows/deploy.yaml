name: CI

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Set the job key. The key is displayed as the job name
  # when a job name is not provided
  build-linux:
    name: "Build Linux"
    runs-on: ["self-hosted", "linux", "large"]
    # container:
    #   image: docker.io/cloudfra/ci-core:canary # Maybe
    permissions:
      contents: write
      packages: write
      code-quality: write
    timeout-minutes: 20
    steps:
      - name: Checkout code
        # https://github.com/actions/checkout
        uses: actions/checkout@v7

      - name: Setup Go
        # https://github.com/actions/setup-go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: System Information
        run: make system-info

      # - name: Container Fix
      #   run: git config --system --add safe.directory /__w/

      - name: Prepare Build
        run: |
          make clean
          make deps
          make lint
          make deps tools -j$(nproc)

      - name: Terraform Test
        run: make tf-test || true

      - name: Test
        run: make test

      - name: Test (Deflake)
        run: make test-deflake

      - name: Coverage
        run: make coverage.txt coverage.xml

      - name: Benchmark
        run: make benchmark.html
      
      - name: Publish Benchmark (7 Days)
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-linux.html
          path: |
            benchmark.html
          retention-days: 7
          if-no-files-found: error

      - name: Push Code Coverage
        # https://github.com/codecov/codecov-action
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos
          files: ./coverage.txt # optional
          flags: unittests # optional
          name: codecov-umbrella # optional
          fail_ci_if_error: true # optional (default = false)
          verbose: true # optional (default = false)

      - name: Upload Coverage Report
        # https://github.com/actions/upload-code-coverage
        # https://docs.github.com/en/code-security/how-tos/maintain-quality-code/set-up-code-coverage#step-2-upload-the-coverage-report
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/gotest

      - name: Build Binaries
        run: make all -j$(nproc)

      - name: Release Package
        if: ${{ github.event_name != 'pull_request' }}
        run: make build/packages/release.tar.gz

      - name: Create Release Binaries
        if: ${{ github.event_name != 'pull_request' }}
        run: make release-binaries

      - name: Login to GitHub Container Registry
        # https://github.com/docker/login-action#github-packages-docker-registry
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        # https://github.com/docker/login-action#github-packages-docker-registry
        uses: docker/login-action@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        # https://github.com/docker/setup-qemu-action
        uses: docker/setup-qemu-action@v4
        if: ${{ github.event_name != 'pull_request' }}

      - name: Set up Docker Buildx
        # https://github.com/docker/setup-buildx-action
        uses: docker/setup-buildx-action@v4
        if: ${{ github.event_name != 'pull_request' }}

      - name: Publish Binaries (Pull Request)
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v7
        if: ${{  github.event_name == 'pull_request' }}
        with:
          name: commit-binaries-${{ github.sha }}
          path: |
            bin/go/linxux_amd64/example
            bin/go/windows_amd64/example.exe
          retention-days: 1
          if-no-files-found: error

      - name: Publish Binaries (7 Days)
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' }}
        with:
          name: commit-binaries-${{ github.sha }}
          path: |
            bin/go/linxux_amd64/example
            bin/go/windows_amd64/example.exe
          retention-days: 7
          if-no-files-found: error

      - name: Create Release
        # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            LICENSE
            bin/release.tar.gz
            bin/release/example.exe
            bin/release/example

      - name: Publish Application
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release.tar.gz
          path: |
            bin/release.tar.gz
            bin/release/*

      - name: Push Images (Commit)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' }}
        run: |
          make REGISTRY=docker.io/cloudfra images
          make bin/release.tar.gz

      - name: Push Images (Release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          make DOCKER_PUSH=--push REGISTRY=docker.io/cloudfra images
          make DOCKER_PUSH=--push REGISTRY=ghcr.io/cloudfra images
          make bin/release.tar.gz

      - name: Push Images (Latest)
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-')
        run: |
          make DOCKER_PUSH=--push REGISTRY=docker.io/cloudfra images
          make DOCKER_PUSH=--push REGISTRY=ghcr.io/cloudfra images
  build-windows:
    name: "Build Windows"
    runs-on: ["self-hosted", "windows"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Build
        run: make windows-binaries -j4

      - name: Test
        run: make test

      - name: Test (Race Test)
        run: make GO_TEST_COUNT=5 test-deflake

      - name: Benchmark
        run: make benchmark.html
      
      - name: Publish Benchmark (7 Days)
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-windows.html
          path: |
            benchmark.html
          retention-days: 7
          if-no-files-found: error
